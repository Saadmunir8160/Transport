<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-md border border-gray-100">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Create an account</h2>
    </div>
    <form class="mt-8 space-y-6" (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div *ngIf="errorMessage" class="bg-red-50 text-red-500 p-3 rounded-md text-sm">
        {{ errorMessage }}
      </div>
      
      <div class="rounded-md shadow-sm space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="firstName" class="sr-only">First Name</label>
            <input id="firstName" name="firstName" type="text" required [(ngModel)]="userData.firstName"
              class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
              placeholder="First Name">
          </div>
          <div>
            <label for="lastName" class="sr-only">Last Name</label>
            <input id="lastName" name="lastName" type="text" required [(ngModel)]="userData.lastName"
              class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
              placeholder="Last Name">
          </div>
        </div>
        
        <div>
          <label for="email-address" class="sr-only">Email address</label>
          <input id="email-address" name="email" type="email" autocomplete="email" required [(ngModel)]="userData.email"
            class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
            placeholder="Email address">
        </div>
        
        <div>
          <label for="password" class="sr-only">Password</label>
          <input id="password" name="password" type="password" required [(ngModel)]="userData.password"
            class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
            placeholder="Password">
        </div>
        
        <div>
          <label for="role" class="block text-sm font-medium text-gray-700">Account Type</label>
          <select id="role" name="role" [(ngModel)]="userData.role"
            class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md">
            <option value="Passenger">Passenger</option>
            <option value="TransportAdmin">Transport Admin</option>
          </select>
        </div>
      </div>

      <div>
        <button type="submit" [disabled]="!registerForm.valid"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50">
          Register
        </button>
      </div>
      
      <div class="text-sm text-center">
        <a routerLink="/auth/login" class="font-medium text-blue-600 hover:text-blue-500">
          Already have an account? Sign in
        </a>
      </div>
    </form>
  </div>
</div>
