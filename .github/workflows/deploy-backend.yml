name: Deploy .NET API to SmarterASP.NET

on:
  push:
    branches:
      - main
    paths:
      - 'AjkTransportSystem.API/**'
      - '.github/workflows/deploy-backend.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore AjkTransportSystem.API/AjkTransportSystem.API.csproj

      - name: Build and Publish
        shell: pwsh
        run: |
          dotnet publish AjkTransportSystem.API/AjkTransportSystem.API.csproj -c Release -o "$PWD/publish" /p:UseAppHost=false

          if ($LASTEXITCODE -ne 0) {
            throw "Build or publish failed."
          }

      - name: Deploy to SmarterASP.NET
        shell: pwsh
        env:
          PUBLISH_PROFILE: ${{ secrets.SMARTERASP_PUBLISH_PROFILE }}
          DEPLOY_PASSWORD: ${{ secrets.SMARTERASP_PASSWORD }}

        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:PUBLISH_PROFILE)) {
            throw "SMARTERASP_PUBLISH_PROFILE is missing."
          }

          [xml]$profile = $env:PUBLISH_PROFILE

          $webDeploy = $profile.publishData.publishProfile |
            Where-Object { $_.publishMethod -eq "MSDeploy" } |
            Select-Object -First 1

          if (-not $webDeploy) {
            throw "MSDeploy profile not found in XML."
          }

          $publishUrl = [string]$webDeploy.publishUrl
          $siteName = [string]$webDeploy.msdeploySite
          $userName = [string]$webDeploy.userName
          $password = $env:DEPLOY_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
            $password = [string]$webDeploy.userPWD
          }

          if ([string]::IsNullOrWhiteSpace($publishUrl) -or
              [string]::IsNullOrWhiteSpace($siteName) -or
              [string]::IsNullOrWhiteSpace($userName) -or
              [string]::IsNullOrWhiteSpace($password)) {
            throw "Deployment configuration is incomplete."
          }

          $msdeployExe = "${env:ProgramFiles}\IIS\Microsoft Web Deploy V3\msdeploy.exe"

          if (-not (Test-Path $msdeployExe)) {
            $msdeployExe = "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          }

          if (-not (Test-Path $msdeployExe)) {
            throw "Microsoft Web Deploy is not installed."
          }

          $publishPath = Join-Path $PWD "publish"

          if (-not (Test-Path $publishPath)) {
            throw "Publish folder does not exist."
          }

          Write-Host "Starting SmarterASP.NET deployment..."
          Write-Host "Site: $siteName"
          Write-Host "Publish URL: $publishUrl"

          $sourceArg = "-source:contentPath=$publishPath"

          $destinationArg = "-dest:contentPath=$siteName,computerName=$publishUrl,userName=$userName,password=$password,authType=Basic"

          $deployArgs = @(
            "-verb:sync"
            $sourceArg
            $destinationArg
            "-allowUntrusted"
            "-skip:objectName=filePath,absolutePath=.*appsettings.*\\.json"
          )

          & $msdeployExe @deployArgs

          if ($LASTEXITCODE -ne 0) {
            throw "Web Deploy failed. Exit code: $LASTEXITCODE"
          }

          Write-Host "SUCCESS: API deployment completed!"